services:
  # ============================================================
  # MySQL 8.0 数据库
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: bi_she_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: bi_she_2024
      MYSQL_DATABASE: bi_she
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../storage/mysql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # FastAPI 应用服务
  # ============================================================
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: bi_she_app
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: bi_she_2024
      MYSQL_DATABASE: bi_she
      CHROMA_PERSIST_DIR: /app/data/chromadb
      HF_HOME: /app/data/hf_cache
      SENTENCE_TRANSFORMERS_HOME: /app/data/st_cache
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # ChromaDB 向量库 + embedding 模型缓存 + 原始数据，全部通过此 volume 持久化
      # 架构说明：ChromaDB 不做独立容器，而是嵌入 FastAPI 进程内运行，
      # 数据目录 ./data/ 通过 bind mount 映射进容器，与本地开发共享同一份数据。
      - ../data:/app/data
      - ../.env:/app/.env:ro
    command: >
      sh -c "sleep 10 && python -m storage.init_storage --skip-etl && uvicorn api.main:app --host 0.0.0.0 --port 8000"

volumes:
  mysql_data:
