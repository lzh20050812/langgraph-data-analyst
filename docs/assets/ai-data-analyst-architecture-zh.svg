<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg{fill:#fff}.title{font:700 31px 'Microsoft YaHei',sans-serif;fill:#172033}.sub{font:15px 'Microsoft YaHei',sans-serif;fill:#64748b}.layer{fill:#f8fafc;stroke:#d7dee8;stroke-width:1.5}.label{font:700 18px 'Microsoft YaHei',sans-serif;fill:#1d4ed8}.box{fill:#fff;stroke:#9aa9bd;stroke-width:1.5}.core{fill:#f7fbff;stroke:#3b82f6;stroke-width:2}.dash{fill:none;stroke:#7aa7df;stroke-width:1.5;stroke-dasharray:7 5}.h{font:700 16px 'Microsoft YaHei',sans-serif;fill:#172033}.t{font:13px 'Microsoft YaHei',sans-serif;fill:#536176}.tiny{font:12px 'Microsoft YaHei',sans-serif;fill:#64748b}.arrow{fill:none;stroke:#3977c3;stroke-width:2;marker-end:url(#a)}.feedback{fill:none;stroke:#3977c3;stroke-width:1.7;stroke-dasharray:6 5;marker-end:url(#a)}.chip{fill:#fff;stroke:#b8c4d3;stroke-width:1.2}.chiptext{font:14px 'Microsoft YaHei',sans-serif;fill:#334155}.legend{font:12px 'Microsoft YaHei',sans-serif;fill:#64748b}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3977c3"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1000"/>
  <text class="title" x="800" y="47" text-anchor="middle">AI 数据分析平台 · 系统架构图</text>
  <text class="sub" x="800" y="75" text-anchor="middle">LangGraph 多智能体编排 · 业务语义约束 · 可追溯证据链</text>

  <!-- Data sources -->
  <rect class="layer" x="25" y="100" width="1550" height="105" rx="12"/>
  <text class="label" x="48" y="135">数据源层</text>
  <g>
    <rect class="box" x="200" y="122" width="210" height="58" rx="8"/><text class="h" x="305" y="157" text-anchor="middle">App 客户数据</text>
    <rect class="box" x="435" y="122" width="210" height="58" rx="8"/><text class="h" x="540" y="157" text-anchor="middle">Web 客户数据</text>
    <rect class="box" x="670" y="122" width="210" height="58" rx="8"/><text class="h" x="775" y="157" text-anchor="middle">订单数据</text>
    <rect class="box" x="905" y="122" width="210" height="58" rx="8"/><text class="h" x="1010" y="157" text-anchor="middle">商品数据</text>
    <rect class="box" x="1140" y="122" width="210" height="58" rx="8"/><text class="h" x="1245" y="157" text-anchor="middle">月度营收数据</text>
  </g>

  <!-- Data and storage -->
  <rect class="layer" x="25" y="225" width="1550" height="135" rx="12"/>
  <text class="label" x="48" y="260">治理与存储层</text>
  <rect class="box" x="200" y="247" width="390" height="84" rx="8"/>
  <text class="h" x="395" y="276" text-anchor="middle">确定性 ETL</text><text class="t" x="395" y="301" text-anchor="middle">字段映射 · 格式归一 · 缺失处理</text><text class="t" x="395" y="321" text-anchor="middle">源内去重 · 跨源合并 · 质量报告</text>
  <rect class="box" x="690" y="247" width="340" height="84" rx="8"/>
  <text class="h" x="860" y="276" text-anchor="middle">MySQL</text><text class="t" x="860" y="302" text-anchor="middle">customers · orders · product_summary</text><text class="t" x="860" y="322" text-anchor="middle">monthly_revenue · 聚合视图</text>
  <rect class="box" x="1130" y="247" width="320" height="84" rx="8"/>
  <text class="h" x="1290" y="276" text-anchor="middle">ChromaDB</text><text class="t" x="1290" y="302" text-anchor="middle">Schema 元数据</text><text class="t" x="1290" y="322" text-anchor="middle">历史分析记忆（独立集合）</text>
  <path class="arrow" d="M775 180V213H395V247"/><path class="arrow" d="M395 331V345H860V331"/><path class="arrow" d="M590 289H690"/><path class="arrow" d="M1030 289H1130"/>

  <!-- Orchestration -->
  <rect class="layer" x="25" y="380" width="1550" height="220" rx="12"/>
  <text class="label" x="48" y="416">智能体编排层</text>
  <rect class="dash" x="185" y="400" width="1360" height="170" rx="12"/>
  <text class="tiny" x="207" y="425">LangGraph 状态图</text>
  <rect class="core" x="210" y="447" width="190" height="78" rx="8"/><text class="h" x="305" y="476" text-anchor="middle">Scope Guard</text><text class="t" x="305" y="500" text-anchor="middle">能力边界 · 越界拒绝</text>
  <rect class="core" x="430" y="447" width="210" height="78" rx="8"/><text class="h" x="535" y="476" text-anchor="middle">Planner Agent</text><text class="t" x="535" y="500" text-anchor="middle">意图识别 · TaskPlan · 路由</text>
  <rect class="core" x="670" y="447" width="210" height="78" rx="8"/><text class="h" x="775" y="476" text-anchor="middle">Schema Agent</text><text class="t" x="775" y="500" text-anchor="middle">向量召回 · 精排 · 字段锚定</text>
  <rect class="core" x="910" y="435" width="240" height="102" rx="8"/><text class="h" x="1030" y="466" text-anchor="middle">SQL Agent</text><text class="t" x="1030" y="491" text-anchor="middle">Query Contract · 字段归属</text><text class="t" x="1030" y="512" text-anchor="middle">只读校验 · 执行反馈 · 有限重试</text>
  <rect class="core" x="1190" y="435" width="310" height="102" rx="8"/><text class="h" x="1345" y="466" text-anchor="middle">EvidenceBundle</text><text class="t" x="1345" y="491" text-anchor="middle">SQL · 结果集 · 来源 · 数据质量</text><text class="t" x="1345" y="512" text-anchor="middle">分析指标 · 预测结果 · 限制说明</text>
  <path class="arrow" d="M400 486H430"/><path class="arrow" d="M640 486H670"/><path class="arrow" d="M880 486H910"/><path class="arrow" d="M1150 486H1190"/>
  <path class="arrow" d="M860 331V399H775V447"/><path class="arrow" d="M900 331V414H1030V435"/><path class="arrow" d="M1290 331V399H775V447"/>
  <rect class="box" x="452" y="544" width="166" height="34" rx="7"/><text class="tiny" x="535" y="566" text-anchor="middle">历史记忆：仅复用方法</text><path class="feedback" d="M535 544V525"/>
  <path class="feedback" d="M1115 435V410H945V435"/><text class="tiny" x="1030" y="402" text-anchor="middle">错误反馈与有限重试</text>

  <!-- Analysis -->
  <rect class="layer" x="25" y="620" width="1550" height="155" rx="12"/>
  <text class="label" x="48" y="656">分析与生成层</text>
  <rect class="box" x="200" y="662" width="230" height="76" rx="8"/><text class="h" x="315" y="691" text-anchor="middle">Governance Agent</text><text class="t" x="315" y="716" text-anchor="middle">质量评分 · 来源追溯</text>
  <rect class="box" x="470" y="662" width="220" height="76" rx="8"/><text class="h" x="580" y="691" text-anchor="middle">Analysis Agent</text><text class="t" x="580" y="716" text-anchor="middle">RFM · K-Means · 运营指标</text>
  <rect class="box" x="730" y="662" width="250" height="76" rx="8"/><text class="h" x="855" y="691" text-anchor="middle">Prediction Agent</text><text class="t" x="855" y="716" text-anchor="middle">XGBoost · Prophet · 强基线</text>
  <rect class="core" x="1040" y="662" width="220" height="76" rx="8"/><text class="h" x="1150" y="691" text-anchor="middle">Report Agent</text><text class="t" x="1150" y="716" text-anchor="middle">证据约束结论 · 限制说明</text>
  <rect class="box" x="1310" y="662" width="210" height="76" rx="8"/><text class="h" x="1415" y="691" text-anchor="middle">Chart Renderer</text><text class="t" x="1415" y="716" text-anchor="middle">ECharts 配置</text>
  <path class="arrow" d="M1345 537V610H315V662"/><path class="arrow" d="M1345 537V625H580V662"/><path class="arrow" d="M1345 537V640H855V662"/>
  <path class="arrow" d="M430 700H1040"/><path class="arrow" d="M690 700H1040"/><path class="arrow" d="M980 700H1040"/><path class="arrow" d="M1260 700H1310"/>

  <!-- Application -->
  <rect class="layer" x="25" y="795" width="1550" height="105" rx="12"/>
  <text class="label" x="48" y="830">应用与服务层</text>
  <rect class="core" x="300" y="816" width="330" height="62" rx="8"/><text class="h" x="465" y="842" text-anchor="middle">FastAPI</text><text class="t" x="465" y="864" text-anchor="middle">/query · /charts · /report · /health</text>
  <rect class="box" x="715" y="816" width="300" height="62" rx="8"/><text class="h" x="865" y="842" text-anchor="middle">Web Dashboard</text><text class="t" x="865" y="864" text-anchor="middle">自然语言查询 · 图表 · 报告</text>
  <rect class="box" x="1100" y="816" width="350" height="62" rx="8"/><text class="h" x="1275" y="842" text-anchor="middle">Docker Compose</text><text class="t" x="1275" y="864" text-anchor="middle">API 服务 · MySQL · 持久化数据卷</text>
  <path class="arrow" d="M1150 738V780H465V816"/><path class="arrow" d="M1415 738V780H465V816"/><path class="arrow" d="M630 847H715"/><path class="feedback" d="M1100 847H1015"/>

  <!-- Cross-cutting -->
  <rect class="layer" x="25" y="920" width="1550" height="60" rx="12"/>
  <text class="label" x="48" y="956">横切保障</text>
  <g>
    <rect class="chip" x="190" y="934" width="170" height="32" rx="16"/><text class="chiptext" x="275" y="955" text-anchor="middle">只读 SQL</text>
    <rect class="chip" x="380" y="934" width="190" height="32" rx="16"/><text class="chiptext" x="475" y="955" text-anchor="middle">结果形状校验</text>
    <rect class="chip" x="590" y="934" width="170" height="32" rx="16"/><text class="chiptext" x="675" y="955" text-anchor="middle">Fail-Closed</text>
    <rect class="chip" x="780" y="934" width="230" height="32" rx="16"/><text class="chiptext" x="895" y="955" text-anchor="middle">Prompt Injection 隔离</text>
    <rect class="chip" x="1030" y="934" width="180" height="32" rx="16"/><text class="chiptext" x="1120" y="955" text-anchor="middle">固定测试集</text>
    <rect class="chip" x="1230" y="934" width="230" height="32" rx="16"/><text class="chiptext" x="1345" y="955" text-anchor="middle">配对消融与统计检验</text>
  </g>
  <text class="legend" x="1500" y="994" text-anchor="end">实线：数据流　　虚线：控制或反馈</text>
</svg>
